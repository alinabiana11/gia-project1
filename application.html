<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Новая заявка - Пассажирам.РФ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Оформление заявки</h1>
        
        <form id="applicationForm">
            <div class="form-group">
                <label>Вид транспорта:</label>
                <select id="transport" required>
                    <option value="Автобус">Автобус</option>
                    <option value="Электробус">Электробус</option>
                    <option value="Трамвай">Трамвай</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Дата начала обучения:</label>
                <input type="date" id="startDate" required min="2026-05-19">
            </div>
            
            <div class="form-group">
                <label>Способ оплаты:</label>
                <select id="paymentMethod" required>
                    <option value="Наличные">Наличные</option>
                    <option value="Банковская карта">Банковская карта</option>
                    <option value="Онлайн перевод">Онлайн перевод</option>
                </select>
            </div>
            
            <button type="submit" class="btn">Отправить заявку</button>
            <a href="profile.html" class="btn btn-secondary">Назад в личный кабинет</a>
        </form>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        
        if(!currentUser || currentUser.isAdmin) {
            window.location.href = 'index.html';
        }
        
        document.getElementById('applicationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const applications = JSON.parse(localStorage.getItem('applications') || '[]');
            
            const newApplication = {
                id: Date.now(),
                userLogin: currentUser.login,
                userName: currentUser.userData.fullname,
                transport: document.getElementById('transport').value,
                startDate: document.getElementById('startDate').value,
                paymentMethod: document.getElementById('paymentMethod').value,
                status: 'Новая',
                createdAt: new Date().toISOString()
            };
            
            applications.push(newApplication);
            localStorage.setItem('applications', JSON.stringify(applications));
            
            alert('Заявка успешно отправлена! Ожидайте подтверждения администратора.');
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
