<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Регистрация - Пассажирам.РФ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Регистрация</h1>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Логин (латиница+цифры, мин 6 символов):</label>
                <input type="text" id="regLogin" required>
            </div>
            
            <div class="form-group">
                <label>Пароль (мин 8 символов):</label>
                <input type="password" id="regPassword" required>
            </div>
            
            <div class="form-group">
                <label>ФИО:</label>
                <input type="text" id="fullname" required>
            </div>
            
            <div class="form-group">
                <label>Дата рождения:</label>
                <input type="date" id="birthdate" required>
            </div>
            
            <div class="form-group">
                <label>Телефон:</label>
                <input type="tel" id="phone" placeholder="+7XXXXXXXXXX" required>
            </div>
            
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            
            <button type="submit" class="btn">Зарегистрироваться</button>
            <p class="register-link">Уже есть аккаунт? <a href="index.html">Войти</a></p>
        </form>
        
        <div id="regError" class="error-message"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const login = document.getElementById('regLogin').value;
            const password = document.getElementById('regPassword').value;
            const fullname = document.getElementById('fullname').value;
            const birthdate = document.getElementById('birthdate').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            
            // Валидация логина
            const loginRegex = /^[a-zA-Z0-9]{6,}$/;
            if(!loginRegex.test(login)) {
                document.getElementById('regError').textContent = 'Логин должен содержать только латиницу и цифры, минимум 6 символов!';
                return;
            }
            
            // Валидация пароля
            if(password.length < 8) {
                document.getElementById('regError').textContent = 'Пароль должен быть минимум 8 символов!';
                return;
            }
            
            // Проверка уникальности логина
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            if(users.find(u => u.login === login)) {
                document.getElementById('regError').textContent = 'Такой логин уже существует!';
                return;
            }
            
            // Сохраняем пользователя
            const newUser = {login, password, fullname, birthdate, phone, email};
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            alert('Регистрация успешна! Теперь войдите в систему.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
